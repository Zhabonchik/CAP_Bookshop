_schema-version: 3.3.0
ID: bookshop
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
  - name: bookshop-srv
    type: java
    path: srv
    properties:
      JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
      SPRING_PROFILES_ACTIVE: cloud,sandbox
    requires:
      - name: bookshop-db
      - name: bookshop-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: sap_java_buildpack_jakarta
      instances: 1
    build-parameters:
      build-result: target/*-exec.jar
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
  - name: bookshop-db-deployer
    type: hdb
    path: db
    requires:
      - name: bookshop-db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
  - name: bookshop-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: bookshop-repo-host
        parameters:
          content-target: true
      - name: bookshop-launchpad-service
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - booksui.zip
          name: booksui
          target-path: resources/
        - artifacts:
            - authorsui.zip
          name: authorsui
          target-path: resources/
        - artifacts:
            - booksauthorsui.zip
          name: booksauthorsui
          target-path: resources/
  - name: booksui
    type: html5
    path: app/books_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: authorsui
    type: html5
    path: app/authors_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: booksauthorsui
    type: html5
    path: app/books_authors_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: bookshop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: bookshop-html5-service
      service-plan: app-host
  - name: bookshop-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api # <-- FIXED: Allows resolution of ~{srv-api/srv-url}
      - name: bookshop-repo-host
      - name: bookshop-auth
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Name: bookshop-srv-api
                Description: Backend Java Service for Bookshop
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: OAuth2UserTokenExchange
                forwardAuthToken: true
              - Name: bookshop-html5-repo-host
                ServiceInstanceName: bookshop-html5-service
                ServiceKeyName: bookshop-repo-host-key
                sap.cloud.service: bookshop.service
              - Authentication: OAuth2UserTokenExchange
                Name: bookshop-uaa
                ServiceInstanceName: bookshop-auth
                ServiceKeyName: bookshop-auth-key
                sap.cloud.service: bookshop.service
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: bookshop-destination-service
      service-plan: lite
  - name: bookshop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bookshop-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*.${default-domain}/** # <-- FIXED: Uses standard landscape wildcards now
  - name: bookshop-launchpad-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: launchpad
      service-plan: standard
    
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true