_schema-version: 3.3.0
ID: bookshop
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
  - name: bookshop-srv
    type: java
    path: srv
    properties:
      JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
      SPRING_PROFILES_ACTIVE: cloud,sandbox
    requires:
      - name: bookshop-db
      - name: bookshop-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: sap_java_buildpack_jakarta
      instances: 1
    build-parameters:
      build-result: target/*-exec.jar
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
  - name: bookshop-db-deployer
    type: hdb
    path: db
    requires:
      - name: bookshop-db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
  - name: bookshop-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: bookshop-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - booksui.zip
          name: booksui
          target-path: resources/
        - artifacts:
            - authorsui.zip
          name: authorsui
          target-path: resources/
        - artifacts:
            - booksauthorsui.zip
          name: booksauthorsui
          target-path: resources/
  - name: bookshop-destinations
    type: com.sap.application.content
    requires:
      - name: bookshop-html5-repo-runtime
        parameters:
          service-key:
            name: bookshop-html5-repo-runtime-key
      - name: bookshop-auth
        parameters:
          service-key:
            name: bookshop-auth-key
      - name: bookshop-repo-host
        parameters:
          service-key:
            name: bookshop-repo-host-key
      - name: srv-api
      - name: bookshop-destination-service
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: bookshop-cdm
              ServiceInstanceName: bookshop-html5-runtime-service
              ServiceKeyName: bookshop-html5-repo-runtime-key
              URL: https://html5-apps-repo-rt.${default-domain}/applications/cdm/bookshop.service
              HTML5.DynamicDestination: true
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: bookshop-html5-repository
              ServiceInstanceName: bookshop-html5-service
              ServiceKeyName: bookshop-repo-host-key
              sap.cloud.service: bookshop.service
            - Name: bookshop-uaa
              Authentication: OAuth2ClientCredentials
              ServiceInstanceName: bookshop-auth
              ServiceKeyName: bookshop-auth-key
              sap.cloud.service: bookshop.service
            - Name: bookshop-srv-api
              Description: Backend Java Service for Bookshop
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2ClientCredentials
              TokenServiceInstanceName: bookshop-auth
              TokenServiceKeyName: bookshop-auth-key
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
  - name: booksui
    type: html5
    path: app/books_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: authorsui
    type: html5
    path: app/authors_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: booksauthorsui
    type: html5
    path: app/books_authors_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: bookshop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: bookshop-html5-service
      service-plan: app-host
  - name: bookshop-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: bookshop-html5-runtime-service
      service-plan: app-runtime
  - name: bookshop-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: bookshop-destination-service
      service-plan: lite
  - name: bookshop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bookshop-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*.${default-domain}/**

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true